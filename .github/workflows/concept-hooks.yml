name: context-hooks

on:
  pull_request:
    paths:
      - "plugins/*/scripts/**"
      - "plugins/*/hooks/hooks.json"
      - "plugins/repoql/skills/**"
      - "plugins/repoql/agents/**"
      - "plugins/repoql-uplink/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".cursor-plugin/**"
      - ".github/workflows/concept-hooks.yml"
      - "plugins/repoql-opencode/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "plugins/*/scripts/**"
      - "plugins/*/hooks/hooks.json"
      - "plugins/repoql/skills/**"
      - "plugins/repoql/agents/**"
      - "plugins/repoql-uplink/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".cursor-plugin/**"
      - ".github/workflows/concept-hooks.yml"
      - "plugins/repoql-opencode/**"
      - "package.json"

jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*_hooks.py'
      - run: python3 -m unittest discover -s tests -p 'test_uplink_plugin.py'
      - run: python3 -m unittest discover -s tests -p 'test_opencode_plugin.py'

  # On Windows every hook runs as PowerShell, and the launcher cases start each
  # hook command under Windows PowerShell, PowerShell 7, Git Bash and cmd.exe.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -v -s tests -p "test_*_hooks.py"
