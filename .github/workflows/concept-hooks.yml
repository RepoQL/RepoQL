name: context-hooks

on:
  pull_request:
    paths:
      - "plugins/*/scripts/**"
      - "plugins/*/hooks/hooks.json"
      - "plugins/repoql/skills/**"
      - "plugins/repoql/agents/**"
      - "plugins/repoql-uplink/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".cursor-plugin/**"
      - ".github/workflows/concept-hooks.yml"
      - "plugins/repoql-opencode/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "plugins/*/scripts/**"
      - "plugins/*/hooks/hooks.json"
      - "plugins/repoql/skills/**"
      - "plugins/repoql/agents/**"
      - "plugins/repoql-uplink/**"
      - ".claude-plugin/**"
      - "tests/**"
      - ".cursor-plugin/**"
      - ".github/workflows/concept-hooks.yml"
      - "plugins/repoql-opencode/**"
      - "package.json"

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: loop the concurrent-callers test behind the test that precedes it in the suite
        run: |
          python3 --version; bash --version | head -1; setsid --version; cat /proc/sys/kernel/pid_max; nproc
          fails=0
          for i in $(seq 1 100); do
            if ! python3 -m unittest discover -s tests -p 'test_mcp_bootstrap_hooks.py' -k test_a_caller -k test_concurrent >out.txt 2>&1; then
              fails=$((fails+1)); echo "::group::failure $i"; cat out.txt; echo "::endgroup::"
            fi
          done
          echo "fails=$fails/100"
      - name: full suite, five times
        run: |
          for i in 1 2 3 4 5; do python3 -m unittest discover -s tests -p 'test_*_hooks.py' 2>&1 | grep -v ResourceWarning | grep -A60 "FAIL:\|^Ran " ; done
