name: repoql-tool-native-publish

on:
  workflow_run:
    workflows: [ repoql-tests ]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  version-check:
    name: Determine version change
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.diff.outputs.publish }}
      current-version: ${{ steps.diff.outputs.current }}
      previous-version: ${{ steps.diff.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Compare RepoQL.ConsoleApp version
        id: diff
        shell: bash
        run: |
          set -eo pipefail

          csproj="src/RepoQL.ConsoleApp/RepoQL.ConsoleApp.csproj"
          current_version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' "$csproj" | head -n1)

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_file=$(git show HEAD^:"$csproj" 2>/dev/null || echo '')
          else
            previous_file=''
          fi

          if [[ -n "$previous_file" ]]; then
            previous_version=$(printf '%s\n' "$previous_file" | sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' | head -n1)
          else
            previous_version=''
          fi

          publish=false
          if [[ -n "$current_version" && "$current_version" != "$previous_version" ]]; then
            publish=true
          fi

          {
            echo "current=$current_version"
            echo "previous=$previous_version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

          if [[ "$publish" == "true" ]]; then
            echo "Version changed: $previous_version -> $current_version"
          else
            echo "RepoQL.ConsoleApp version unchanged ($current_version)."
          fi

  native:
    needs: version-check
    # Always run on manual trigger; otherwise require a version bump.
    if: github.event_name == 'workflow_dispatch' || needs.version-check.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: macos-14, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      PUBLISH_ROOT: ${{ github.workspace }}/artifacts/publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:?setup-java did not set JAVA_HOME}"
          java -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Set USERPROFILE for Antlr4BuildTasks (macOS/Linux)
        if: runner.os != 'Windows'
        run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV
      - name: Pre-fetch ANTLR tool jar
        shell: bash
        run: |
          set -euo pipefail
          version="4.13.1"
          target_dir="${USERPROFILE:-$HOME}/.m2"
          mkdir -p "$target_dir"
          jar_file="$target_dir/antlr4-${version}-complete.jar"
          if [ ! -f "$jar_file" ]; then
            echo "Downloading ANTLR ${version} tool jar to ${jar_file}"
            curl -fsSL --retry 3 -o "$jar_file" \
              "https://repo1.maven.org/maven2/org/antlr/antlr4/${version}/antlr4-${version}-complete.jar"
          else
            echo "ANTLR tool jar already exists at ${jar_file}"
          fi
          ls -la "$jar_file"
      - name: Restore
        run: dotnet restore
      - name: Publish ${{ matrix.rid }} binary
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail

          publish_dir="${PUBLISH_ROOT}/${RID}"
          rm -rf "$publish_dir"

          dotnet publish src/RepoQL.ConsoleApp/RepoQL.ConsoleApp.csproj \
            -c Release \
            -r "$RID" \
            -o "$publish_dir" \
            --nologo

          binary_name="repoql"
          if [[ "$RID" == win-* ]]; then
            binary_name="repoql.exe"
          fi

          binary_path="$publish_dir/$binary_name"
          if [[ ! -f "$binary_path" ]]; then
            echo "Expected binary $binary_name not found under $publish_dir" >&2
            ls -al "$publish_dir"
            exit 1
          fi

          echo "Published binary: $binary_path"
          {
            echo "REPOQL_BINARY_PATH=$binary_path"
            echo "REPOQL_BINARY_NAME=$binary_name"
          } >> "$GITHUB_ENV"
      - name: Smoke test ${{ matrix.rid }} binary
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-GroupedLog([string]$title, [string]$content) {
            Write-Host "::group::$title"
            if ([string]::IsNullOrWhiteSpace($content)) {
              Write-Host "(empty)"
            }
            else {
              Write-Host $content
            }
            Write-Host "::endgroup::"
          }

          function Read-TextFile([string]$path) {
            if (Test-Path $path) {
              return [System.IO.File]::ReadAllText($path)
            }

            return ""
          }

          function Stop-RepoQlHost([string]$repoRoot) {
            $lockPath = Join-Path $repoRoot ".repoql/host.lock"
            if (-not (Test-Path $lockPath)) {
              return
            }

            $lockContent = [System.IO.File]::ReadAllText($lockPath)
            $match = [regex]::Match($lockContent, 'PID:(\d+)')
            if (-not $match.Success) {
              return
            }

            $processId = [int]$match.Groups[1].Value
            try {
              $process = Get-Process -Id $processId -ErrorAction Stop
              Stop-Process -Id $processId -Force -ErrorAction Stop
              $process.WaitForExit(10000) | Out-Null
            }
            catch {
              Write-Host "Host cleanup warning: $($_.Exception.Message)"
            }
          }

          $repoRoot = Join-Path $env:RUNNER_TEMP ("repoql-smoke-" + $env:RID)
          if (Test-Path $repoRoot) {
            Remove-Item -Recurse -Force $repoRoot
          }

          New-Item -ItemType Directory -Path $repoRoot | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $repoRoot '.repoql') | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $repoRoot 'README.md'), "# Smoke test`n")

          $hostLogPath = Join-Path $repoRoot '.repoql/host.log'
          $hostStderrPath = Join-Path $repoRoot '.repoql/host.stderr.log'
          $binaryPath = $env:REPOQL_BINARY_PATH

          $stdoutFile = Join-Path $repoRoot 'smoke.stdout.log'
          $stderrFile = Join-Path $repoRoot 'smoke.stderr.log'
          $stdout = ""
          $stderr = ""
          $hostLog = ""
          $hostStderr = ""

          $smokeSql = '"SELECT 1 AS ok"'

          try {
            $process = Start-Process `
              -FilePath $binaryPath `
              -ArgumentList @('query', $smokeSql) `
              -WorkingDirectory $repoRoot `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile `
              -PassThru

            if (-not $process.WaitForExit(60000)) {
              try { Stop-Process -Id $process.Id -Force -ErrorAction Stop } catch {}
              throw "Smoke test timed out after 60 seconds."
            }

            $stdout = Read-TextFile $stdoutFile
            $stderr = Read-TextFile $stderrFile
            $hostLog = Read-TextFile $hostLogPath
            $hostStderr = Read-TextFile $hostStderrPath

            if ($process.ExitCode -ne 0) {
              throw "Smoke test exited with code $($process.ExitCode)."
            }

            if ($stdout -notmatch '(^|\s)1(\s|$)') {
              throw "Smoke test output did not contain the expected query result."
            }
          }
          finally {
            $stdout = if ([string]::IsNullOrWhiteSpace($stdout)) { Read-TextFile $stdoutFile } else { $stdout }
            $stderr = if ([string]::IsNullOrWhiteSpace($stderr)) { Read-TextFile $stderrFile } else { $stderr }
            $hostLog = if ([string]::IsNullOrWhiteSpace($hostLog)) { Read-TextFile $hostLogPath } else { $hostLog }
            $hostStderr = if ([string]::IsNullOrWhiteSpace($hostStderr)) { Read-TextFile $hostStderrPath } else { $hostStderr }

            Write-GroupedLog "Smoke stdout ($env:RID)" $stdout
            Write-GroupedLog "Smoke stderr ($env:RID)" $stderr
            Write-GroupedLog "Host log ($env:RID)" $hostLog
            Write-GroupedLog "Host stderr ($env:RID)" $hostStderr
            Stop-RepoQlHost $repoRoot
          }
      - name: Upload ${{ matrix.rid }} binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: repoql-${{ matrix.rid }}
          path: ${{ env.REPOQL_BINARY_PATH }}

  publish-r2:
    needs: [version-check, native]
    # Always run on manual trigger; otherwise require a version bump.
    if: github.event_name == 'workflow_dispatch' || needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, linux-arm64, win-x64, win-arm64, osx-arm64 ]
    env:
      RELEASE_VERSION: ${{ needs.version-check.outputs['current-version'] }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
    steps:
      - name: Ensure bucket configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_R2_BUCKET:-}" ]]; then
            echo "Repository variable CLOUDFLARE_R2_BUCKET must be set to the destination bucket name." >&2
            exit 1
          fi
          version="${RELEASE_VERSION:-latest}"
          echo "RESOLVED_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download repoql-${{ matrix.rid }} artifact
        uses: actions/download-artifact@v4
        with:
          name: repoql-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
      - name: Upload binary to Cloudflare R2 (versioned)
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          source-dir: artifacts/publish/${{ matrix.rid }}
          destination-dir: ${{ format('{0}/{1}', env.RESOLVED_VERSION, matrix.rid) }}
      - name: Upload binary to Cloudflare R2 (latest)
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          source-dir: artifacts/publish/${{ matrix.rid }}
          destination-dir: ${{ format('latest/{0}', matrix.rid) }}
      - name: Write latest version marker
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/version-marker
          printf '%s\n' "${RESOLVED_VERSION}" > artifacts/version-marker/version.txt
      - name: Upload version marker to Cloudflare R2 (latest)
        if: matrix.rid == 'linux-x64'
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          source-dir: artifacts/version-marker
          destination-dir: latest

  purge-cloudflare-cache:
    needs: [version-check, publish-r2]
    if: github.event_name == 'workflow_dispatch' || needs.version-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_DOWNLOAD_HOST: ${{ vars.CLOUDFLARE_DOWNLOAD_HOST }}
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
    steps:
      - name: Check cache purge configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          present=0

          for name in CLOUDFLARE_ZONE_ID CLOUDFLARE_DOWNLOAD_HOST CLOUDFLARE_CACHE_PURGE_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done

          if [[ $present -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare cache purge not configured; skipping."
            exit 0
          fi

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Partial Cloudflare cache purge configuration detected." >&2
            printf 'Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Purge latest download URLs from Cloudflare cache
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -nc --arg host "$CLOUDFLARE_DOWNLOAD_HOST" '{
            files: [
              ("https://" + $host + "/latest/version.txt"),
              ("https://" + $host + "/latest/linux-x64/repoql"),
              ("https://" + $host + "/latest/linux-arm64/repoql"),
              ("https://" + $host + "/latest/osx-arm64/repoql"),
              ("https://" + $host + "/latest/win-x64/repoql.exe"),
              ("https://" + $host + "/latest/win-arm64/repoql.exe")
            ]
          }')

          response=$(curl --silent --show-error --fail \
            --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload")

          echo "$response" | jq .

  skip-notice:
    needs: version-check
    # Only emit skip notice for automated triggers; always run when manually queued (workflow_dispatch).
    if: >
      github.event_name != 'workflow_dispatch' && (
        (needs.version-check.result == 'success' && needs.version-check.outputs.publish != 'true') ||
        needs.version-check.result == 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Publish skipped
        shell: bash
        run: |
          if [[ "${{ needs.version-check.result }}" == "skipped" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "Skip native publish: repoql-tests did not complete successfully on main."
            else
              echo "Skip native publish: workflow dispatched without meeting publish conditions."
            fi
          else
            echo "RepoQL.ConsoleApp version unchanged (${{ needs.version-check.outputs.current-version }}). Skipping native publish workflow."
          fi
