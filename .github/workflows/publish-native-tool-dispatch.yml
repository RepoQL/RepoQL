name: repoql-tool-native-publish-dispatch
run-name: >-
  repoql-tool-native-publish dispatch${{
    github.event.workflow_run.head_branch != '' && format(' ({0})', github.event.workflow_run.head_branch) || ''
  }}

on:
  workflow_run:
    workflows: [ repoql-tests ]
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    name: Dispatch versioned publish run
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compare RepoQL.ConsoleApp version
        id: diff
        shell: bash
        run: |
          set -eo pipefail

          csproj="src/RepoQL.ConsoleApp/RepoQL.ConsoleApp.csproj"
          current_version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' "$csproj" | head -n1)

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            previous_file=$(git show HEAD^:"$csproj" 2>/dev/null || echo '')
          else
            previous_file=''
          fi

          if [[ -n "$previous_file" ]]; then
            previous_version=$(printf '%s\n' "$previous_file" | sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' | head -n1)
          else
            previous_version=''
          fi

          publish=false
          if [[ -n "$current_version" && "$current_version" != "$previous_version" ]]; then
            publish=true
          fi

          {
            echo "current=$current_version"
            echo "previous=$previous_version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch repoql-tool-native-publish
        if: steps.diff.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            repos/${{ github.repository }}/dispatches \
            -f event_type='repoql-tool-native-publish' \
            -f client_payload[head_sha]='${{ github.event.workflow_run.head_sha }}' \
            -f client_payload[head_branch]='${{ github.event.workflow_run.head_branch }}' \
            -f client_payload[version]='${{ steps.diff.outputs.current }}'

      - name: Publish skipped
        if: steps.diff.outputs.publish != 'true'
        shell: bash
        run: |
          echo "RepoQL.ConsoleApp version unchanged (${{ steps.diff.outputs.current }}). Not dispatching native publish."
