name: deploy-embedding-writer

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'GCP region'
        default: 'us-central1'
        type: string
      image_tag:
        description: 'Container image tag (default: git SHA)'
        default: ''
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-embedding-writer-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  SERVICE_NAME: repoql-embedding-writer
  AR_HOSTNAME: ${{ inputs.region || 'us-central1' }}-docker.pkg.dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy writer to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tag
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_SHA:0:12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || 'us-central1' }}
        run: |
          set -euo pipefail

          registry="${REGION}-docker.pkg.dev"
          repository="${GCP_PROJECT_ID}/repoql/${SERVICE_NAME}"
          full_image="${registry}/${repository}:${IMAGE_TAG}"

          echo "Publishing container image: ${full_image}"

          dotnet publish src/RepoQL.Embedding.Writer/RepoQL.Embedding.Writer.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry="${registry}" \
            -p:ContainerRepository="${repository}" \
            -p:ContainerImageTag="${IMAGE_TAG}" \
            --nologo

          echo "image=${full_image}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ inputs.region || 'us-central1' }}
          image: ${{ env.image }}
          flags: >-
            --port=8080
            --min-instances=0
            --max-instances=1
            --memory=1Gi
            --cpu=1
            --timeout=300
            --no-allow-unauthenticated
            --service-account=cache-writer-${{ inputs.environment }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=ASPNETCORE_URLS=http://+:8080,Writer__StorageBackend=gcs,OTEL_SERVICE_NAME=repoql-embedding-writer,OTEL_RESOURCE_ATTRIBUTES=service.version=${{ steps.tag.outputs.tag }}
            --set-env-vars=Writer__EmbeddingsBucket=${{ vars.CACHE_EMBEDDINGS_BUCKET }},Writer__StagingBucket=${{ vars.CACHE_STAGING_BUCKET }}
            --set-secrets=REPOQL_CACHE_GCS_HMAC_KEY_ID=${{ vars.CACHE_WRITER_HMAC_KEY_SECRET }}:latest,REPOQL_CACHE_GCS_HMAC_SECRET=${{ vars.CACHE_WRITER_HMAC_SECRET_SECRET }}:latest

      - name: Create Eventarc trigger for staging bucket
        shell: bash
        env:
          REGION: ${{ inputs.region || 'us-central1' }}
          TRIGGER_SA: embedding-service-${{ inputs.environment }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          set -euo pipefail

          TRIGGER_NAME="staging-to-writer-${{ inputs.environment }}"

          # Grant the embedding service SA run.invoker on the writer service
          gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${REGION}" \
            --member="serviceAccount:${TRIGGER_SA}" \
            --role="roles/run.invoker" \
            --quiet

          # Create or update the Eventarc trigger
          if gcloud eventarc triggers describe "$TRIGGER_NAME" --project="${{ vars.GCP_PROJECT_ID }}" --location="${REGION}" &>/dev/null; then
            echo "Eventarc trigger ${TRIGGER_NAME} already exists."
          else
            gcloud eventarc triggers create "$TRIGGER_NAME" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --location="${REGION}" \
              --destination-run-service="$SERVICE_NAME" \
              --destination-run-region="${REGION}" \
              --destination-run-path="/merge" \
              --event-filters="type=google.cloud.storage.object.v1.finalized" \
              --event-filters="bucket=${{ vars.CACHE_STAGING_BUCKET }}" \
              --service-account="${TRIGGER_SA}"
            echo "Created Eventarc trigger ${TRIGGER_NAME}."
          fi
