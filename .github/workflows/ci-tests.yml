name: repoql-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACTS_PATH: ${{ github.workspace }}/artifacts/tests
      TEST_OUTPUT_PATH: ${{ github.workspace }}/artifacts/tests/shared-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true
      - name: Set USERPROFILE for Antlr4BuildTasks (Linux)
        run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install coverage tooling
        run: |
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore RepoQL.sln --nologo
      - name: Build test projects (Release)
        run: |
          set -euo pipefail

          TEST_OUTPUT_DIR="${{ env.TEST_OUTPUT_PATH }}"
          mkdir -p "$TEST_OUTPUT_DIR"

          mapfile -t test_projects < <(dotnet sln RepoQL.sln list | awk '/\.Tests\.csproj$/ {print}' | sort)
          echo "Found ${#test_projects[@]} test project(s) in RepoQL.sln"
          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo "No test projects found in RepoQL.sln" >&2
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            project_dir="$(dirname "$project")"
            first_source=$(find "$project_dir" -maxdepth 5 -name '*.cs' -type f | head -n1)
            if [[ -z "$first_source" ]]; then
              echo "Skipping $project (no test sources detected)"
              continue
            fi

            echo "Building test project: $project"
            dotnet build \
              "$project" \
              --configuration Release \
              --no-restore \
              --nologo \
              -p:OutputPath="$TEST_OUTPUT_DIR/"
          done
      - name: Run tests with coverage
        id: test
        run: |
          set -euo pipefail

          ARTIFACTS_DIR="${{ env.ARTIFACTS_PATH }}"
          TEST_OUTPUT_DIR="${{ env.TEST_OUTPUT_PATH }}"
          rm -rf "$ARTIFACTS_DIR/coverage" "$ARTIFACTS_DIR/test-results"
          mkdir -p "$ARTIFACTS_DIR/coverage" "$ARTIFACTS_DIR/test-results"

          mapfile -t test_projects < <(dotnet sln RepoQL.sln list | awk '/\.Tests\.csproj$/ {print}' | sort)
          echo "Found ${#test_projects[@]} test project(s) in RepoQL.sln"
          if [[ "${#test_projects[@]}" -eq 0 ]]; then
            echo "No test projects found in RepoQL.sln" >&2
            exit 1
          fi

          for project in "${test_projects[@]}"; do
            project_dir="$(dirname "$project")"
            first_source=$(find "$project_dir" -maxdepth 5 -name '*.cs' -type f | head -n1)
            if [[ -z "$first_source" ]]; then
              echo "Skipping $project (no test sources detected)"
              continue
            fi

            echo "Running tests for: $project"
            dotnet run \
              --project "$project" \
              --configuration Release \
              --no-build \
              -p:OutputPath="$TEST_OUTPUT_DIR/" \
              -- \
              --coverage \
              --coverage-output-format cobertura \
              --report-trx \
              --results-directory "$ARTIFACTS_DIR/test-results"
          done

          mapfile -t coverage_files < <(find "$ARTIFACTS_DIR/test-results" -name "*.cobertura.xml" -type f | sort)
          echo "Found ${#coverage_files[@]} coverage file(s)"
          if [[ "${#coverage_files[@]}" -eq 0 ]]; then
            echo "No coverage files generated" >&2
            exit 1
          fi

          if [[ "${#coverage_files[@]}" -eq 1 ]]; then
            cp "${coverage_files[0]}" "$ARTIFACTS_DIR/coverage/coverage.cobertura.xml"
          else
            merge_args=()
            for file in "${coverage_files[@]}"; do
              merge_args+=("--reports" "$file")
            done
            dotnet-coverage merge "${merge_args[@]}" --output "$ARTIFACTS_DIR/coverage/coverage.cobertura.xml" --output-format cobertura
          fi

          if [[ ! -f "$ARTIFACTS_DIR/test-results/tests.trx" ]]; then
            mapfile -t trx_candidates < <(find "$ARTIFACTS_DIR/test-results" -name '*.trx' -type f | sort)
            if [[ "${#trx_candidates[@]}" -gt 0 ]]; then
              cp "${trx_candidates[-1]}" "$ARTIFACTS_DIR/test-results/tests.trx"
            fi
          fi
      - name: Generate coverage report
        if: steps.test.outcome == 'success'
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: '${{ env.ARTIFACTS_PATH }}/coverage/coverage.cobertura.xml'
          targetdir: '${{ env.ARTIFACTS_PATH }}/coverage/report'
          reporttypes: 'Html;MarkdownSummaryGithub'
          tag: '${{ github.run_number }}_${{ github.run_id }}'
      - name: Publish coverage summary
        if: steps.test.outcome == 'success'
        run: |
          summary='${{ env.ARTIFACTS_PATH }}/coverage/report/SummaryGithub.md'
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not generated (missing $summary)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish test results (GitHub UI)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            ${{ env.ARTIFACTS_PATH }}/test-results/**/*.trx
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.ARTIFACTS_PATH }}/test-results/**/*
            ${{ env.ARTIFACTS_PATH }}/coverage/coverage.cobertura.xml
            ${{ env.ARTIFACTS_PATH }}/coverage/report/**
