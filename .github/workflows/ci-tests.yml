name: repoql-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Set USERPROFILE for Antlr4BuildTasks (Linux)
        run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RepoQL.sln --nologo

      - name: Build solution (Release)
        run: dotnet build RepoQL.sln --configuration Release --no-restore --nologo

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-bins
          path: artifacts/bin/*Tests*/
          retention-days: 1

  test:
    name: Test (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tests: >-
              RepoQL.Tests
              RepoQL.Core.Tests
              RepoQL.Cli.Tests
              RepoQL.Data.Tests
              RepoQL.Data.DuckDB.Tests
              RepoQL.FileSystem.Tests
              RepoQL.Protocol.Tests
              RepoQL.Mcp.Client.Tests
              RepoQL.Sarif.Tests
              RepoQL.Indexing.Tests

          - shard: formats
            tests: >-
              RepoQL.Formats.Cpp.Tests
              RepoQL.Formats.CSS.Tests
              RepoQL.Formats.Csv.Tests
              RepoQL.Formats.Docx.Tests
              RepoQL.Formats.DotNet.Tests
              RepoQL.Formats.Go.Tests
              RepoQL.Formats.Json.Tests
              RepoQL.Formats.Mermaid.Tests
              RepoQL.Formats.Pdf.Tests
              RepoQL.Formats.PHP.Tests
              RepoQL.Formats.Python.Tests
              RepoQL.Formats.Ruby.Tests
              RepoQL.Formats.Rust.Tests
              RepoQL.Formats.Terraform.Tests
              RepoQL.Formats.TypeScript.Tests
              RepoQL.Formats.Xlsx.Tests

          - shard: engine
            tests: >-
              RepoQL.Rendering.Tests
              RepoQL.Sandbox.Tests
              RepoQL.Embedding.Client.Tests
              RepoQL.Embedding.Service.Tests
              RepoQL.Embedding.Writer.Tests
              RepoQL.Inference.Client.Tests
              RepoQL.Inference.Service.Tests
              RepoQL.SnapshotGenerator.Tests

    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: test-bins
          path: test-bins/

      - name: Expose GitHub Actions runtime for TUnit HTML reports
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run tests
        run: |
          failed=0
          for name in ${{ matrix.tests }}; do
            dir=$(find test-bins -type d -name "${name}" | head -1)
            if [[ -z "$dir" ]]; then
              echo "::error::Test directory not found for ${name}"
              failed=1
              continue
            fi
            # Find the release output directory (release_linux-x64 or similar)
            bin=$(find "$dir" -name "${name}.dll" -path "*/release*" | head -1)
            if [[ -z "$bin" ]]; then
              echo "::error::Test DLL not found for ${name}"
              failed=1
              continue
            fi
            bindir=$(dirname "$bin")
            echo "::group::${name}"
            if ! dotnet exec "$bin" \
              --coverage \
              --coverage-output-format cobertura \
              --report-trx \
              --results-directory "$(pwd)/TestResults"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: |
            TestResults/**/*

  results:
    name: Test Results
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: ./TestResults
          merge-multiple: true

      - name: Install coverage tooling
        run: |
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          mapfile -t coverage_files < <(find ./TestResults -name "*.cobertura.xml" -type f | sort)
          echo "Found ${#coverage_files[@]} coverage file(s)"

          if [[ "${#coverage_files[@]}" -eq 0 ]]; then
            echo "No coverage files generated" >&2
            exit 0
          elif [[ "${#coverage_files[@]}" -eq 1 ]]; then
            cp "${coverage_files[0]}" coverage/coverage.cobertura.xml
          else
            merge_args=()
            for file in "${coverage_files[@]}"; do
              merge_args+=("--reports" "$file")
            done
            dotnet-coverage merge "${merge_args[@]}" --output coverage/coverage.cobertura.xml --output-format cobertura
          fi

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'coverage/coverage.cobertura.xml'
          targetdir: 'coverage/report'
          reporttypes: 'Html;MarkdownSummaryGithub'

      - name: Publish coverage summary
        run: |
          summary='coverage/report/SummaryGithub.md'
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test results (GitHub UI)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            ./TestResults/**/*.trx

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ./TestResults/**/*
            coverage/**
