name: repoql-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: true
      - name: Show disk space (pre-checkout)
        run: df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Set USERPROFILE for Antlr4BuildTasks (Linux)
        run: echo "USERPROFILE=$HOME" >> $GITHUB_ENV
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install coverage tooling
        run: |
          dotnet tool install --global dotnet-coverage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore RepoQL.sln --nologo
      - name: Build solution (Release)
        run: dotnet build RepoQL.sln --configuration Release --no-restore --nologo
      - name: Run tests with coverage
        id: test
        run: |
          dotnet test \
            --solution RepoQL.sln \
            --configuration Release \
            --no-build \
            -- \
            --coverage \
            --coverage-output-format cobertura \
            --report-trx
      - name: Merge coverage reports
        if: always() && !cancelled()
        run: |
          RESULTS_DIR="${{ env.ARTIFACTS_PATH }}/TestResults"
          COVERAGE_DIR="${{ env.ARTIFACTS_PATH }}/coverage"
          mkdir -p "$COVERAGE_DIR"

          mapfile -t coverage_files < <(find "$RESULTS_DIR" -name "*.cobertura.xml" -type f | sort)
          echo "Found ${#coverage_files[@]} coverage file(s)"

          if [[ "${#coverage_files[@]}" -eq 0 ]]; then
            echo "No coverage files generated" >&2
            exit 0
          elif [[ "${#coverage_files[@]}" -eq 1 ]]; then
            cp "${coverage_files[0]}" "$COVERAGE_DIR/coverage.cobertura.xml"
          else
            merge_args=()
            for file in "${coverage_files[@]}"; do
              merge_args+=("--reports" "$file")
            done
            dotnet-coverage merge "${merge_args[@]}" --output "$COVERAGE_DIR/coverage.cobertura.xml" --output-format cobertura
          fi
      - name: Show disk space (post-tests)
        if: always()
        run: df -h
      - name: Generate coverage report
        if: always() && !cancelled()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: '${{ env.ARTIFACTS_PATH }}/coverage/coverage.cobertura.xml'
          targetdir: '${{ env.ARTIFACTS_PATH }}/coverage/report'
          reporttypes: 'Html;MarkdownSummaryGithub'
          tag: '${{ github.run_number }}_${{ github.run_id }}'
      - name: Publish coverage summary
        if: always() && !cancelled()
        run: |
          summary='${{ env.ARTIFACTS_PATH }}/coverage/report/SummaryGithub.md'
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not generated (missing $summary)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish test results (GitHub UI)
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            ${{ env.ARTIFACTS_PATH }}/TestResults/**/*.trx
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.ARTIFACTS_PATH }}/TestResults/**/*
            ${{ env.ARTIFACTS_PATH }}/coverage/coverage.cobertura.xml
            ${{ env.ARTIFACTS_PATH }}/coverage/report/**
