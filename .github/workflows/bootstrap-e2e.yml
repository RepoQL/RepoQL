# End-to-end proof of the plugin's binary bootstrap: on a bare runner (no rql),
# running bootstrap-rql.sh alone must yield a working binary in the canonical
# per-platform location — ~/.local/bin on macOS/Linux, %LOCALAPPDATA%\rql plus
# a user PATH registry entry on Windows (where the hook runs under Git Bash and
# delegates to the hosted PowerShell installer).
name: bootstrap-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugins/*/scripts/**"
      - "plugins/repoql/.mcp.json"
      - ".github/workflows/bootstrap-e2e.yml"
  pull_request:
    paths:
      - "plugins/*/scripts/**"
      - "plugins/repoql/.mcp.json"
      - ".github/workflows/bootstrap-e2e.yml"

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run bootstrap on a bare machine
        run: plugins/repoql/scripts/bootstrap-rql.sh

      - name: Verify rql in the canonical location
        run: |
          test -x "$HOME/.local/bin/rql"
          "$HOME/.local/bin/rql" --version

      - name: Re-run takes the already-installed fast path
        run: |
          plugins/repoql/scripts/bootstrap-rql.sh
          grep -c "installing from downloads.repoql.ai" "$HOME/.local/state/repoql/bootstrap.log" | grep -qx 1

  # The claim the README makes: on a machine with no rql, and a launch PATH
  # without ~/.local/bin, installing the plugin is enough for Claude Code
  # itself to connect the bundled MCP server. No hook runs here, so only the
  # launcher in .mcp.json can be what makes it work.
  claude-code-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: not-a-key-mcp-list-makes-no-api-call
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code and the plugin from this checkout
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin marketplace add "$PWD"
          claude plugin install repoql@repoql-plugins

      - name: Launch PATH has no rql and no ~/.local/bin
        run: |
          launch_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vx "$HOME/.local/bin" | paste -sd: -)
          echo "LAUNCH_PATH=$launch_path" >> "$GITHUB_ENV"
          ! PATH="$launch_path" command -v rql
          test ! -e "$HOME/.local/bin/rql"

      # The launcher answers the handshake while the download runs, so the
      # server connects inside the default 30s timeout with no binary yet.
      - name: Server connects on a machine with no rql
        run: |
          PATH="$LAUNCH_PATH" claude mcp list | tee first.txt
          grep -E 'plugin:repoql:repoql.*Connected' first.txt

      - name: The download outlives that connection and installs the canonical binary
        run: |
          for _ in $(seq 1 180); do test -x "$HOME/.local/bin/rql" && break; sleep 5; done
          cat "$HOME/.local/state/repoql/bootstrap.log" | tr '\r' '\n' | grep -v '%$' || true
          "$HOME/.local/bin/rql" --version
          grep -c "installing from downloads.repoql.ai" "$HOME/.local/state/repoql/bootstrap.log" | grep -qx 1

      - name: Server connects through rql when the launch PATH still lacks it
        run: |
          PATH="$LAUNCH_PATH" claude mcp list | tee second.txt
          grep -E 'plugin:repoql:repoql.*Connected' second.txt

  # On Windows the launcher is rql-mcp.cmd, which waits for the download, so
  # the client's connection timeout is raised to cover it.
  claude-code-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: not-a-key-mcp-list-makes-no-api-call
      MCP_TIMEOUT: "600000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code and the plugin from this checkout
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude plugin marketplace add "$PWD"
          claude plugin install repoql@repoql-plugins

      - name: Server connects on a machine with no rql
        shell: pwsh
        run: |
          if (Get-Command rql -ErrorAction SilentlyContinue) { throw 'rql is already on PATH' }
          claude mcp list | Tee-Object first.txt
          if (-not (Select-String -Path first.txt -Pattern 'plugin:repoql:repoql.*Connected')) { throw 'the server did not connect' }
          & (Join-Path $env:LOCALAPPDATA 'rql\rql.exe') --version

      # Steps get the runner's original environment, so PATH still lacks the
      # installer's registry entry - the launcher must find rql.exe itself.
      - name: Server connects again without rql on PATH
        shell: pwsh
        env:
          MCP_TIMEOUT: "30000"
        run: |
          if (Get-Command rql -ErrorAction SilentlyContinue) { throw 'rql is on PATH; this step proves nothing' }
          claude mcp list | Tee-Object second.txt
          if (-not (Select-String -Path second.txt -Pattern 'plugin:repoql:repoql.*Connected')) { throw 'the server did not connect' }

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run bootstrap under Git Bash
        shell: bash
        run: plugins/repoql/scripts/bootstrap-rql.sh

      - name: Verify rql.exe in the canonical location
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "rql\rql.exe"
          if (-not (Test-Path $exe)) { throw "rql.exe not found at $exe" }
          & $exe --version

      - name: Verify user PATH registry entry
        shell: pwsh
        run: |
          $dir = (Join-Path $env:LOCALAPPDATA "rql").TrimEnd('\')
          $entries = [Environment]::GetEnvironmentVariable("Path", "User") -split ';' |
            ForEach-Object { $_.TrimEnd('\') }
          if (-not ($entries | Where-Object { $_ -ieq $dir })) {
            throw "user PATH is missing $dir"
          }

      # Steps get the runner's original environment, so this step's PATH still
      # lacks the registry entry — exactly the state of a hook whose parent
      # process predates the install. The fast path must detect the binary via
      # %LOCALAPPDATA% directly, not via PATH.
      - name: Re-run takes the already-installed fast path
        shell: bash
        run: |
          plugins/repoql/scripts/bootstrap-rql.sh
          count=$(grep -c "installing from downloads.repoql.ai" "$HOME/.local/state/repoql/bootstrap.log")
          [ "$count" = "1" ]

      # session-start depends on Git Bash resolving `rql` to rql.exe once
      # %LOCALAPPDATA%\rql is on PATH — only provable on real Windows. This
      # also exercises the freshly downloaded binary end to end (rql query
      # spins the host up against the checkout).
      - name: session-start emits an orientation envelope
        shell: bash
        timeout-minutes: 5
        run: |
          plugins/repoql/scripts/session-start.sh > ss.json
          jq -e '.hookSpecificOutput.additionalContext | contains("RepoQL")' ss.json

  # The Cursor plugin on a bare Windows machine: no rql, no Git Bash in the
  # path of the hook. Cursor pipes the payload to the hook command from Windows
  # PowerShell, so these steps do the same.
  cursor-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: First session installs rql through the hook
        shell: powershell
        run: |
          $env:CURSOR_PROJECT_DIR = $PWD
          $hook = Join-Path $PWD 'plugins\repoql-cursor\scripts\run-hook.cmd'
          $answer = '{"hook_event_name":"sessionStart"}' | & $hook session-start
          $answer
          if (($answer | ConvertFrom-Json).additional_context -notlike '*rql was just installed*') {
            Get-Content (Join-Path $HOME '.local\state\repoql\bootstrap.log')
            throw 'the first session did not report an install'
          }

      - name: Verify rql.exe in the canonical location
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'rql\rql.exe'
          if (-not (Test-Path $exe)) { throw "rql.exe not found at $exe" }
          & $exe --version

      # Steps get the runner's original environment, so PATH still lacks the
      # registry entry - the state of a hook whose parent predates the install.
      - name: Second session orients without installing again
        shell: powershell
        run: |
          $env:CURSOR_PROJECT_DIR = $PWD
          $hook = Join-Path $PWD 'plugins\repoql-cursor\scripts\run-hook.cmd'
          $answer = '{"hook_event_name":"sessionStart"}' | & $hook session-start
          $answer
          if (($answer | ConvertFrom-Json).additional_context -notlike '# RepoQL: Repository Orientation*Imported Repositories*') {
            throw 'the second session did not orient'
          }
          $installs = @(Select-String -Path (Join-Path $HOME '.local\state\repoql\bootstrap.log') -Pattern 'installing from downloads.repoql.ai').Count
          if ($installs -ne 1) { throw "expected one install, found $installs" }
