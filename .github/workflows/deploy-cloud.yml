name: deploy-cloud-service

on:
  # Auto-deploy dev when CI passes on main
  workflow_run:
    workflows: ["repoql-tests"]
    types: [completed]
    branches: [main]

  # Manual deploy to any environment
  workflow_dispatch:
    inputs:
      region:
        description: 'GCP region'
        default: 'us-central1'
        type: string
      image_tag:
        description: 'Container image tag (default: git SHA)'
        default: ''
        type: string
      enable_cache:
        description: 'Enable cloud embedding cache'
        default: false
        type: boolean
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-cloud-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  SERVICE_NAME: repoql-cloud

permissions:
  contents: read
  id-token: write

jobs:
  check-changes:
    name: Check for cloud-relevant changes
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check changed paths
        id: check
        shell: bash
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/RepoQL\.(Cloud\.Service|Embedding\.(Proto|Storage)|Inference\.Proto)/|infra/|Directory\.(Build|Packages)\.props$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No cloud-relevant changes — skipping deployment"
          fi

  deploy-dev:
    name: Deploy to dev
    needs: [check-changes]
    if: >-
      always() &&
      ((needs.check-changes.outputs.deploy == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    runs-on: ubuntu-latest
    environment: dev
    env:
      REGION: ${{ inputs.region || 'us-central1' }}
      AR_HOSTNAME: ${{ inputs.region || 'us-central1' }}-docker.pkg.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tag
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            sha="${{ github.event.workflow_run.head_sha || github.sha }}"
            tag="${sha:0:12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          registry="${REGION}-docker.pkg.dev"
          repository="${GCP_PROJECT_ID}/repoql/${SERVICE_NAME}"
          full_image="${registry}/${repository}:${IMAGE_TAG}"

          echo "Publishing container image: ${full_image}"

          dotnet publish src/RepoQL.Cloud.Service/RepoQL.Cloud.Service.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry="${registry}" \
            -p:ContainerRepository="${repository}" \
            -p:ContainerImageTag="${IMAGE_TAG}" \
            --nologo

          echo "image=${full_image}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ env.REGION }}
          image: ${{ env.image }}
          flags: >-
            --use-http2
            --port=8080
            --min-instances=0
            --max-instances=2
            --memory=1Gi
            --cpu=1
            --timeout=300
            --allow-unauthenticated
            --service-account=cloud-service-dev@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=ASPNETCORE_URLS=http://+:8080,OTEL_SERVICE_NAME=repoql-cloud,OTEL_RESOURCE_ATTRIBUTES=service.version=${{ steps.tag.outputs.tag }}
            --set-secrets=Embedding__VoyageApiKey=repoql-embedding-voyage-api-key:latest,Inference__GrokApiKey=repoql-inference-grok-api-key:latest,Auth__ApiKeyHashes__0=repoql-embedding-auth-key-hash-0:latest,Auth__ApiKeyHashes__1=repoql-embedding-auth-key-hash-1:latest,Firestore__ProjectId=repoql-cloud-firestore-project:latest

      - name: Enable cloud cache
        if: inputs.enable_cache
        shell: bash
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${REGION}" \
            --set-env-vars="CacheLayer__Enabled=true,CacheLayer__StorageBackend=gcs" \
            --set-env-vars="CacheLayer__EmbeddingsBucket=${{ vars.CACHE_EMBEDDINGS_BUCKET }},CacheLayer__StagingBucket=${{ vars.CACHE_STAGING_BUCKET }}" \
            --update-secrets="REPOQL_CACHE_GCS_HMAC_KEY_ID=${{ vars.CACHE_CLOUD_HMAC_KEY_SECRET }}:latest,REPOQL_CACHE_GCS_HMAC_SECRET=${{ vars.CACHE_CLOUD_HMAC_SECRET_SECRET }}:latest"

  deploy-prod:
    name: Deploy to prod
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod  # Requires approval via GitHub environment protection rules
    env:
      REGION: ${{ inputs.region || 'us-central1' }}
      AR_HOSTNAME: ${{ inputs.region || 'us-central1' }}-docker.pkg.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_HOSTNAME }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine image tag
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_SHA:0:12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          registry="${REGION}-docker.pkg.dev"
          repository="${GCP_PROJECT_ID}/repoql/${SERVICE_NAME}"
          full_image="${registry}/${repository}:${IMAGE_TAG}"

          echo "Publishing container image: ${full_image}"

          dotnet publish src/RepoQL.Cloud.Service/RepoQL.Cloud.Service.csproj \
            -c Release \
            /t:PublishContainer \
            -p:ContainerRegistry="${registry}" \
            -p:ContainerRepository="${repository}" \
            -p:ContainerImageTag="${IMAGE_TAG}" \
            --nologo

          echo "image=${full_image}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ env.REGION }}
          image: ${{ env.image }}
          flags: >-
            --use-http2
            --port=8080
            --min-instances=0
            --max-instances=2
            --memory=1Gi
            --cpu=1
            --timeout=300
            --allow-unauthenticated
            --service-account=cloud-service-prod@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --set-env-vars=ASPNETCORE_URLS=http://+:8080,OTEL_SERVICE_NAME=repoql-cloud,OTEL_RESOURCE_ATTRIBUTES=service.version=${{ steps.tag.outputs.tag }}
            --set-secrets=Embedding__VoyageApiKey=repoql-embedding-voyage-api-key:latest,Inference__GrokApiKey=repoql-inference-grok-api-key:latest,Auth__ApiKeyHashes__0=repoql-embedding-auth-key-hash-0:latest,Auth__ApiKeyHashes__1=repoql-embedding-auth-key-hash-1:latest,Firestore__ProjectId=repoql-cloud-firestore-project:latest

      - name: Enable cloud cache
        if: inputs.enable_cache
        shell: bash
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${REGION}" \
            --set-env-vars="CacheLayer__Enabled=true,CacheLayer__StorageBackend=gcs" \
            --set-env-vars="CacheLayer__EmbeddingsBucket=${{ vars.CACHE_EMBEDDINGS_BUCKET }},CacheLayer__StagingBucket=${{ vars.CACHE_STAGING_BUCKET }}" \
            --update-secrets="REPOQL_CACHE_GCS_HMAC_KEY_ID=${{ vars.CACHE_CLOUD_HMAC_KEY_SECRET }}:latest,REPOQL_CACHE_GCS_HMAC_SECRET=${{ vars.CACHE_CLOUD_HMAC_SECRET_SECRET }}:latest"
