<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepoQL — Materializing</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root {
  --bg:#0e0e11;--surface:#161619;--raised:#1c1c20;--well:#0a0a0d;
  --border:#252530;--border-l:#32323e;
  --fg:#e0dfd8;--fg2:#8a8a80;--fg3:#555550;--fg4:#333338;
  --blue:#4a9eff;--amber:#f0a030;--green:#3dd68c;--green-soft:rgba(61,214,140,.08);
  --red:#e05050;
  /* Language colors — GitHub-inspired */
  --lang-cs:#68217a;--lang-ts:#3178c6;--lang-py:#3572a5;--lang-rs:#dea584;
  --lang-go:#00add8;--lang-java:#b07219;--lang-md:#083fa1;--lang-json:#40d47e;
  --lang-yaml:#cb171e;--lang-toml:#9c4221;--lang-js:#f1e05a;--lang-rb:#701516;
  --lang-cpp:#f34b7d;--lang-css:#563d7c;--lang-html:#e34c26;--lang-sql:#e38c00;
  --lang-sh:#89e051;--lang-xml:#0060ac;--lang-proto:#4a6a87;--lang-unknown:#555560;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ─── HEADER ─── */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);transition:all 1s}
.hdr-dot.active{background:var(--blue);box-shadow:0 0 8px rgba(74,158,255,.3);animation:hdot 2s ease-in-out infinite}
.hdr-dot.done{background:var(--green);box-shadow:0 0 10px rgba(61,214,140,.3);animation:none}
@keyframes hdot{0%,100%{opacity:1}50%{opacity:.4}}
.hdr-title{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--fg2)}
.hdr-right{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:var(--fg3)}

/* ─── MAIN LAYOUT ─── */
.main{flex:1;display:grid;grid-template-columns:1fr 220px;grid-template-rows:1fr auto;gap:0;min-height:0;overflow:hidden}

/* ─── LEFT: TREEMAP ─── */
.treemap-area{grid-row:1/2;grid-column:1/2;display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0;overflow:hidden}
.treemap-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.treemap-title{font-size:.6rem;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.1em}
.treemap-stats{display:flex;gap:16px}
.tm-stat{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--fg3)}
.tm-stat span{color:var(--fg2)}

.treemap-body{flex:1;padding:12px;overflow:hidden;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}

/* Directory group */
.dir-group{border:1px solid var(--border);border-radius:3px;padding:6px;background:var(--surface);position:relative;overflow:hidden}
.dir-label{font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--fg3);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
.dir-files{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}

/* Individual file tile */
.ftile{width:7px;height:7px;border-radius:1px;background:var(--fg4);border:1px solid transparent;transition:background .5s ease,border-color .4s ease,box-shadow .6s ease}

/* State: discovered (appears) */
.ftile.discovered{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.06)}

/* State: classified — border becomes language color */
.ftile.classified{background:rgba(255,255,255,.06)}

/* State: parsed — fills with language color at low opacity */
.ftile.parsed{opacity:1}

/* State: struct-embedded (searchable) — full color, subtle glow */
.ftile.searchable{opacity:1}

/* State: full-embedded — bright, gentle pulse */
.ftile.full-embedded{opacity:1}

/* Active processing shimmer */
.ftile.processing{animation:shimmer .8s ease-in-out infinite alternate}
@keyframes shimmer{from{filter:brightness(1)}to{filter:brightness(1.6)}}

/* Failed */
.ftile.failed{background:var(--red)!important;border-color:var(--red)!important;opacity:.7}

/* ─── RIGHT SIDEBAR ─── */
.sidebar{grid-row:1/2;grid-column:2/3;display:flex;flex-direction:column;background:var(--surface);min-height:0;overflow:hidden}

/* Rings */
.rings-section{padding:20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;align-items:center}
.rings-section svg{overflow:visible}
.ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .4s ease}
.ring-center-pct{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:300;fill:var(--fg);text-anchor:middle;transition:fill 1s}
.ring-center-pct.done{fill:var(--green)}
.ring-center-label{font-size:.5rem;fill:var(--fg3);text-anchor:middle;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.ring-legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;width:100%}
.rl{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:var(--fg3)}
.rl-left{display:flex;align-items:center;gap:6px}
.rl-dot{width:6px;height:6px;border-radius:50%}
.rl-val{color:var(--fg2)}

/* Phase */
.phase-section{padding:14px 20px;border-bottom:1px solid var(--border)}
.phase-label{font-size:.55rem;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.phase-val{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--fg2)}

/* Language spectrum */
.spectrum-section{padding:14px 20px;border-bottom:1px solid var(--border)}
.spectrum-label{font-size:.55rem;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.spectrum-bar{height:8px;display:flex;border-radius:2px;overflow:hidden;background:var(--well);gap:1px}
.spec-seg{transition:flex .6s ease;min-width:0}
.spectrum-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px}
.spec-item{display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:.5rem;color:var(--fg3)}
.spec-dot{width:5px;height:5px;border-radius:1px}

/* Activity stream */
.stream-section{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stream-label{font-size:.55rem;font-weight:500;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;padding:14px 20px 8px;flex-shrink:0}
.stream-list{flex:1;overflow:hidden;padding:0 20px;position:relative}
.stream-list::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--surface));pointer-events:none}
.s-item{font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--fg3);padding:2px 0;display:flex;align-items:center;gap:6px;opacity:0;animation:sIn .3s ease forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-dot{width:4px;height:4px;border-radius:1px;flex-shrink:0}
@keyframes sIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}

/* ─── BOTTOM: SANKEY ─── */
.sankey-area{grid-row:2/3;grid-column:1/3;border-top:1px solid var(--border);background:var(--surface);height:120px;padding:8px 24px}
.sankey-svg{width:100%;height:100%}
.sk-label{font-size:.55rem;fill:var(--fg3);font-family:'IBM Plex Mono',monospace}
.sk-val{font-size:.85rem;fill:var(--fg2);font-family:'IBM Plex Mono',monospace;font-weight:400}
.sk-val.active{fill:var(--fg)}

/* ─── COMPLETION ─── */
.done-wash{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 3s;background:radial-gradient(ellipse at 30% 40%,rgba(61,214,140,.04),transparent 50%)}
.done-wash.show{opacity:1}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-dot" id="hdrDot"></div>
    <span class="hdr-title" id="hdrTitle">repoql · awaiting operation</span>
  </div>
  <div class="hdr-right" id="hdrTime">0.0s</div>
</div>

<div class="main">
  <!-- LEFT: Directory Treemap -->
  <div class="treemap-area">
    <div class="treemap-header">
      <span class="treemap-title">Codebase</span>
      <div class="treemap-stats">
        <div class="tm-stat"><span id="tsTotal">0</span> files</div>
        <div class="tm-stat"><span id="tsClassified">0</span> classified</div>
        <div class="tm-stat"><span id="tsParsed">0</span> parsed</div>
        <div class="tm-stat"><span id="tsSearchable">0</span> searchable</div>
      </div>
    </div>
    <div class="treemap-body" id="treemapBody"></div>
  </div>

  <!-- RIGHT: Sidebar -->
  <div class="sidebar">
    <!-- Rings -->
    <div class="rings-section">
      <svg width="150" height="150" viewBox="-75 -75 150 150">
        <circle class="ring-bg" cx="0" cy="0" r="65"/>
        <circle class="ring-bg" cx="0" cy="0" r="50"/>
        <circle class="ring-bg" cx="0" cy="0" r="35"/>
        <circle id="ringOuter" class="ring-fill" cx="0" cy="0" r="65" stroke="var(--blue)" stroke-dasharray="0 999" transform="rotate(-90)"/>
        <circle id="ringMid" class="ring-fill" cx="0" cy="0" r="50" stroke="var(--amber)" stroke-dasharray="0 999" transform="rotate(-90)"/>
        <circle id="ringInner" class="ring-fill" cx="0" cy="0" r="35" stroke="var(--green)" stroke-dasharray="0 999" transform="rotate(-90)"/>
        <text id="ringPct" class="ring-center-pct" x="0" y="4">0%</text>
        <text class="ring-center-label" x="0" y="16">ready</text>
      </svg>
      <div class="ring-legend">
        <div class="rl"><span class="rl-left"><span class="rl-dot" style="background:var(--blue)"></span>Parsed</span><span class="rl-val" id="rlParsed">0</span></div>
        <div class="rl"><span class="rl-left"><span class="rl-dot" style="background:var(--amber)"></span>Struct embed</span><span class="rl-val" id="rlStruct">0</span></div>
        <div class="rl"><span class="rl-left"><span class="rl-dot" style="background:var(--green)"></span>Full embed</span><span class="rl-val" id="rlFull">0</span></div>
      </div>
    </div>

    <!-- Phase -->
    <div class="phase-section">
      <div class="phase-label">Phase</div>
      <div class="phase-val" id="phaseVal">Initializing</div>
    </div>

    <!-- Language Spectrum -->
    <div class="spectrum-section">
      <div class="spectrum-label">Languages</div>
      <div class="spectrum-bar" id="spectrumBar"></div>
      <div class="spectrum-legend" id="spectrumLegend"></div>
    </div>

    <!-- Activity -->
    <div class="stream-section">
      <div class="stream-label">Activity</div>
      <div class="stream-list" id="streamList"></div>
    </div>
  </div>

  <!-- BOTTOM: Sankey -->
  <div class="sankey-area">
    <svg class="sankey-svg" id="sankeySvg" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<div class="done-wash" id="doneWash"></div>

<script>
// ═══════════════════════════════════════════
//  DATA MODEL
// ═══════════════════════════════════════════
const TOTAL = 847;
const FAIL_COUNT = 2;
const FAIL_INDICES = [287, 654]; // specific files that fail

const DIRS = [
  { path: 'src/', weight: .18 },
  { path: 'src/auth/', weight: .09 },
  { path: 'src/api/', weight: .12 },
  { path: 'src/core/', weight: .14 },
  { path: 'lib/', weight: .08 },
  { path: 'tests/', weight: .11 },
  { path: 'src/models/', weight: .07 },
  { path: 'src/utils/', weight: .06 },
  { path: 'src/services/', weight: .10 },
  { path: 'src/middleware/', weight: .05 },
];

const LANG_MAP = {
  '.cs':    { name: 'C#',         color: '#68217a' },
  '.ts':    { name: 'TypeScript', color: '#3178c6' },
  '.py':    { name: 'Python',     color: '#3572a5' },
  '.rs':    { name: 'Rust',       color: '#dea584' },
  '.go':    { name: 'Go',         color: '#00add8' },
  '.java':  { name: 'Java',       color: '#b07219' },
  '.md':    { name: 'Markdown',   color: '#083fa1' },
  '.json':  { name: 'JSON',       color: '#40d47e' },
  '.yaml':  { name: 'YAML',       color: '#cb171e' },
  '.toml':  { name: 'TOML',       color: '#9c4221' },
  '.js':    { name: 'JavaScript', color: '#f1e05a' },
  '.rb':    { name: 'Ruby',       color: '#701516' },
  '.cpp':   { name: 'C++',        color: '#f34b7d' },
  '.css':   { name: 'CSS',        color: '#563d7c' },
  '.html':  { name: 'HTML',       color: '#e34c26' },
  '.sql':   { name: 'SQL',        color: '#e38c00' },
};

const NAMES = ['Auth','Config','Handler','Service','Model','Router','Parser',
  'Builder','Factory','Manager','Utils','Index','Types','Schema','Query',
  'Token','Cache','Logger','Validator','Mapper','Store','Provider','Client',
  'Server','Worker','Task','Job','Event','Stream','Pipeline','Module',
  'Registry','Loader','Encoder','Decoder','Proxy','Gateway','Filter'];

const EXT_POOL = Object.keys(LANG_MAP);

// Deterministic file generation with seeded random
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// Generate all files upfront
const files = [];
{
  const rng = seededRandom(42);
  let dirIdx = 0;
  let dirRemaining = Math.floor(DIRS[0].weight * TOTAL);

  for (let i = 0; i < TOTAL; i++) {
    while (dirRemaining <= 0 && dirIdx < DIRS.length - 1) {
      dirIdx++;
      dirRemaining = Math.floor(DIRS[dirIdx].weight * TOTAL);
    }
    dirRemaining--;

    const ext = EXT_POOL[Math.floor(rng() * EXT_POOL.length)];
    const name = NAMES[Math.floor(rng() * NAMES.length)];
    const lang = LANG_MAP[ext];

    files.push({
      id: i,
      dir: dirIdx,
      path: DIRS[dirIdx].path + name + ext,
      ext,
      lang,
      state: 'hidden', // hidden → discovered → classified → parsed → struct_embedded → full_embedded | failed
    });
  }
  // Mark fail files
  for (const fi of FAIL_INDICES) {
    if (files[fi]) files[fi].willFail = true;
  }
}

// Pipeline state
const pipeline = {
  discovered: 0,
  classified: 0,
  parsed: 0,
  structEmbedded: 0,  // searchable via tools
  fullEmbedded: 0,    // full semantic search
  failed: 0,
  phase: 'idle',
  rate: 0,
  readyPct: 0, // structEmbedded / total
  fullPct: 0,  // fullEmbedded / total
};

// Active processing set (indices of files currently being worked on)
let activeSet = new Set();

// ═══════════════════════════════════════════
//  TIMELINE (compressed to ~40s)
//
//  0-2.5s:     Discovery (files appear)
//  1-4s:       Classification (overlaps with late discovery)
//  3-18s:      Parsing (main throughput phase)
//  8-22s:      Structure embedding (overlaps with parsing tail)
//  20-36s:     Full embedding (slow, background)
//  36-38s:     Index rebuild
//  38s:        Complete
// ═══════════════════════════════════════════

function updatePipeline(t) {
  // Discovery
  if (t < 2.5) {
    const p = Math.min(1, t / 2.2);
    const e = 1 - Math.pow(1 - p, 3);
    pipeline.discovered = Math.floor(e * TOTAL);
  } else {
    pipeline.discovered = TOTAL;
  }

  // Classification (starts at 0.8s, peaks during 1-4s)
  if (t >= 0.8) {
    const p = Math.min(1, (t - 0.8) / 3.5);
    const e = 1 - Math.pow(1 - p, 2.5);
    pipeline.classified = Math.min(pipeline.discovered, Math.floor(e * TOTAL));
  }

  // Parsing (starts at 3s, main phase)
  if (t >= 3 && t < 18) {
    pipeline.phase = 'parsing';
    const p = Math.min(1, (t - 3) / 14);
    const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2) / 2;
    pipeline.parsed = Math.min(pipeline.classified, Math.floor(e * TOTAL));
    pipeline.rate = Math.floor(30 + Math.random() * 35);
  } else if (t >= 18) {
    pipeline.parsed = TOTAL;
    if (pipeline.phase === 'parsing') pipeline.rate = 0;
  }

  // Structure embedding (starts at 8s, done by 22s — makes files searchable)
  if (t >= 8 && t < 22) {
    if (t >= 18) pipeline.phase = 'struct_embedding';
    const p = Math.min(1, (t - 8) / 14);
    const e = Math.pow(p, 0.7);
    pipeline.structEmbedded = Math.min(pipeline.parsed, Math.floor(e * (TOTAL - FAIL_COUNT)));
    // Failures appear during parsing/embedding
    pipeline.failed = p > 0.1 ? FAIL_COUNT : Math.floor(p / 0.1 * FAIL_COUNT);
  } else if (t >= 22) {
    pipeline.structEmbedded = TOTAL - FAIL_COUNT;
    pipeline.failed = FAIL_COUNT;
  }

  // Full embedding (starts at 20s, slow grind to 36s)
  if (t >= 20 && t < 36) {
    pipeline.phase = 'full_embedding';
    const p = Math.min(1, (t - 20) / 16);
    const e = Math.pow(p, 0.9);
    pipeline.fullEmbedded = Math.floor(e * (TOTAL - FAIL_COUNT));
    pipeline.rate = Math.floor(8 + Math.random() * 12);
  } else if (t >= 36) {
    pipeline.fullEmbedded = TOTAL - FAIL_COUNT;
  }

  // Rebuild: 36-38s
  if (t >= 36 && t < 38) pipeline.phase = 'rebuilding';

  // Complete
  if (t >= 38) {
    pipeline.phase = 'complete';
    pipeline.rate = 0;
  }

  // Determine current phase label
  if (t < 0.8) pipeline.phase = 'discovery';
  else if (t < 3) pipeline.phase = 'classifying';
  else if (t < 18) pipeline.phase = 'parsing';
  // struct_embedding, full_embedding, rebuilding, complete set above

  pipeline.readyPct = TOTAL > 0 ? Math.min(100, Math.floor(pipeline.structEmbedded / TOTAL * 100)) : 0;
  pipeline.fullPct = TOTAL > 0 ? Math.min(100, Math.floor(pipeline.fullEmbedded / TOTAL * 100)) : 0;
  if (pipeline.phase === 'complete') { pipeline.readyPct = 100; pipeline.fullPct = 100; }

  // Update file states
  activeSet.clear();
  for (let i = 0; i < TOTAL; i++) {
    const f = files[i];
    if (f.willFail && pipeline.failed > 0 && i < pipeline.parsed + 10) {
      f.state = 'failed';
      continue;
    }
    if (i < pipeline.fullEmbedded) f.state = 'full_embedded';
    else if (i < pipeline.structEmbedded) f.state = 'struct_embedded';
    else if (i < pipeline.parsed) f.state = 'parsed';
    else if (i < pipeline.classified) f.state = 'classified';
    else if (i < pipeline.discovered) f.state = 'discovered';
    else f.state = 'hidden';

    // Mark files near the frontier as "processing"
    if (f.state === 'classified' && i >= pipeline.parsed - 5 && i < pipeline.parsed + 8) activeSet.add(i);
    if (f.state === 'parsed' && i >= pipeline.structEmbedded - 3 && i < pipeline.structEmbedded + 5) activeSet.add(i);
    if (f.state === 'struct_embedded' && i >= pipeline.fullEmbedded - 2 && i < pipeline.fullEmbedded + 4) activeSet.add(i);
  }
}

// ═══════════════════════════════════════════
//  TREEMAP
// ═══════════════════════════════════════════
const tmBody = document.getElementById('treemapBody');
const dirGroups = [];
const fileTiles = [];

// Build directory groups
for (let di = 0; di < DIRS.length; di++) {
  const dirFiles = files.filter(f => f.dir === di);
  const group = document.createElement('div');
  group.className = 'dir-group';
  // Size based on file count
  const w = Math.max(80, Math.sqrt(dirFiles.length / TOTAL) * 440);
  group.style.width = w + 'px';

  const label = document.createElement('div');
  label.className = 'dir-label';
  label.textContent = DIRS[di].path.replace(/\/$/, '');
  group.appendChild(label);

  const filesWrap = document.createElement('div');
  filesWrap.className = 'dir-files';

  for (const f of dirFiles) {
    const tile = document.createElement('div');
    tile.className = 'ftile';
    tile.title = f.path;
    filesWrap.appendChild(tile);
    fileTiles[f.id] = tile;
  }

  group.appendChild(filesWrap);
  tmBody.appendChild(group);
  dirGroups.push(group);
}

function updateTreemap() {
  for (let i = 0; i < TOTAL; i++) {
    const f = files[i];
    const tile = fileTiles[i];
    if (!tile) continue;

    const isActive = activeSet.has(i);
    const langColor = f.lang.color;

    switch (f.state) {
      case 'hidden':
        tile.style.background = '';
        tile.style.borderColor = 'transparent';
        tile.style.boxShadow = 'none';
        tile.className = 'ftile';
        break;
      case 'discovered':
        tile.style.background = 'rgba(255,255,255,.07)';
        tile.style.borderColor = 'rgba(255,255,255,.05)';
        tile.style.boxShadow = 'none';
        tile.className = 'ftile discovered';
        break;
      case 'classified':
        tile.style.background = 'rgba(255,255,255,.04)';
        tile.style.borderColor = langColor;
        tile.style.boxShadow = 'none';
        tile.className = 'ftile classified' + (isActive ? ' processing' : '');
        break;
      case 'parsed':
        tile.style.background = langColor;
        tile.style.borderColor = langColor;
        tile.style.opacity = '.35';
        tile.style.boxShadow = 'none';
        tile.className = 'ftile parsed' + (isActive ? ' processing' : '');
        break;
      case 'struct_embedded':
        tile.style.background = langColor;
        tile.style.borderColor = langColor;
        tile.style.opacity = '.65';
        tile.style.boxShadow = `0 0 3px ${langColor}40`;
        tile.className = 'ftile searchable' + (isActive ? ' processing' : '');
        break;
      case 'full_embedded':
        tile.style.background = langColor;
        tile.style.borderColor = langColor;
        tile.style.opacity = '.9';
        tile.style.boxShadow = `0 0 4px ${langColor}50`;
        tile.className = 'ftile full-embedded';
        break;
      case 'failed':
        tile.style.background = 'var(--red)';
        tile.style.borderColor = 'var(--red)';
        tile.style.opacity = '.7';
        tile.style.boxShadow = 'none';
        tile.className = 'ftile failed';
        break;
    }
  }
}

// ═══════════════════════════════════════════
//  RINGS
// ═══════════════════════════════════════════
function updateRings() {
  const parsedP = TOTAL > 0 ? pipeline.parsed / TOTAL : 0;
  const structP = TOTAL > 0 ? pipeline.structEmbedded / TOTAL : 0;
  const fullP = TOTAL > 0 ? pipeline.fullEmbedded / TOTAL : 0;

  const c65 = 2 * Math.PI * 65, c50 = 2 * Math.PI * 50, c35 = 2 * Math.PI * 35;
  document.getElementById('ringOuter').setAttribute('stroke-dasharray', `${parsedP * c65} ${c65}`);
  document.getElementById('ringMid').setAttribute('stroke-dasharray', `${structP * c50} ${c50}`);
  document.getElementById('ringInner').setAttribute('stroke-dasharray', `${fullP * c35} ${c35}`);

  const pct = document.getElementById('ringPct');
  pct.textContent = pipeline.readyPct + '%';
  pct.setAttribute('class', 'ring-center-pct' + (pipeline.phase === 'complete' ? ' done' : ''));

  document.getElementById('rlParsed').textContent = pipeline.parsed + ' / ' + TOTAL;
  document.getElementById('rlStruct').textContent = pipeline.structEmbedded + ' / ' + TOTAL;
  document.getElementById('rlFull').textContent = pipeline.fullEmbedded + ' / ' + TOTAL;
}

// ═══════════════════════════════════════════
//  LANGUAGE SPECTRUM
// ═══════════════════════════════════════════
function updateSpectrum() {
  const counts = {};
  for (let i = 0; i < pipeline.classified; i++) {
    const ext = files[i].ext;
    counts[ext] = (counts[ext] || 0) + 1;
  }

  const bar = document.getElementById('spectrumBar');
  const legend = document.getElementById('spectrumLegend');
  const total = pipeline.classified || 1;

  // Sort by count
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  let barHTML = '';
  let legHTML = '';
  for (const [ext, count] of sorted) {
    const lang = LANG_MAP[ext];
    const pct = count / total;
    barHTML += `<div class="spec-seg" style="flex:${pct};background:${lang.color};opacity:.7"></div>`;
    if (pct > 0.04) {
      legHTML += `<div class="spec-item"><span class="spec-dot" style="background:${lang.color}"></span>${lang.name} ${Math.round(pct * 100)}%</div>`;
    }
  }
  bar.innerHTML = barHTML;
  legend.innerHTML = legHTML;
}

// ═══════════════════════════════════════════
//  SANKEY FLOW
// ═══════════════════════════════════════════
function updateSankey() {
  const svg = document.getElementById('sankeySvg');
  const box = svg.getBoundingClientRect();
  const W = box.width || 800, H = box.height || 120;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const maxH = H - 40;
  const barW = 24;
  const stages = [
    { label: 'Discovered', val: pipeline.discovered, x: 20, color: 'var(--fg3)' },
    { label: 'Classified', val: pipeline.classified, x: W * 0.2, color: 'var(--fg2)' },
    { label: 'Parsed', val: pipeline.parsed, x: W * 0.4, color: 'var(--blue)' },
    { label: 'Searchable', val: pipeline.structEmbedded, x: W * 0.6, color: 'var(--amber)' },
    { label: 'Full Embed', val: pipeline.fullEmbedded, x: W * 0.8, color: 'var(--green)' },
  ];

  let html = '';
  for (let i = 0; i < stages.length; i++) {
    const s = stages[i];
    const h = TOTAL > 0 ? Math.max(3, s.val / TOTAL * maxH) : 3;
    const y = (H - h) / 2;

    // Bar
    html += `<rect x="${s.x}" y="${y}" width="${barW}" height="${h}" fill="${s.color}" opacity=".5" rx="2"/>`;
    // Value
    const isActive = (i === 0 && pipeline.phase === 'discovery') ||
                     (i === 1 && pipeline.phase === 'classifying') ||
                     (i === 2 && pipeline.phase === 'parsing') ||
                     (i === 3 && (pipeline.phase === 'struct_embedding')) ||
                     (i === 4 && pipeline.phase === 'full_embedding');
    html += `<text class="sk-val${isActive ? ' active' : ''}" x="${s.x + barW/2}" y="${y - 6}" text-anchor="middle">${s.val}</text>`;
    html += `<text class="sk-label" x="${s.x + barW/2}" y="${H - 4}" text-anchor="middle">${s.label}</text>`;

    // Flow to next
    if (i < stages.length - 1) {
      const s1 = stages[i + 1];
      const h1 = TOTAL > 0 ? Math.max(3, s1.val / TOTAL * maxH) : 3;
      const y1 = (H - h1) / 2;
      const x0 = s.x + barW, x1 = s1.x;
      const cx = (x0 + x1) / 2;
      const path = `M${x0},${y} C${cx},${y} ${cx},${y1} ${x1},${y1} L${x1},${y1+h1} C${cx},${y1+h1} ${cx},${y+h} ${x0},${y+h} Z`;
      html += `<path d="${path}" fill="${s1.color}" opacity=".08"/>`;
    }
  }

  // Failed indicator
  if (pipeline.failed > 0) {
    html += `<text class="sk-label" x="${W - 20}" y="${H/2 + 4}" text-anchor="end" fill="var(--red)">${pipeline.failed} failed</text>`;
  }

  svg.innerHTML = html;
}

// ═══════════════════════════════════════════
//  ACTIVITY STREAM
// ═══════════════════════════════════════════
let lastStreamTime = 0;
function updateStream(t) {
  if (t - lastStreamTime < 0.12 || pipeline.phase === 'idle' || pipeline.phase === 'complete') return;
  lastStreamTime = t;

  const frontier = Math.max(0, Math.min(TOTAL - 1,
    pipeline.phase === 'discovery' || pipeline.phase === 'classifying' ? pipeline.classified :
    pipeline.phase === 'parsing' ? pipeline.parsed :
    pipeline.fullEmbedded
  ));
  const f = files[Math.min(frontier, TOTAL - 1)];
  if (!f) return;

  const sl = document.getElementById('streamList');
  const el = document.createElement('div');
  el.className = 's-item';

  const stateLabel = pipeline.phase === 'parsing' ? 'parse' :
                     pipeline.phase === 'classifying' ? 'classify' :
                     pipeline.phase === 'struct_embedding' ? 'embed:struct' :
                     pipeline.phase === 'full_embedding' ? 'embed:full' : 'scan';
  el.innerHTML = `<span class="s-dot" style="background:${f.lang.color}"></span><span style="color:var(--fg3)">${stateLabel}</span> <span style="color:var(--fg2)">${f.path}</span>`;
  sl.prepend(el);
  while (sl.children.length > 30) sl.lastChild.remove();
}

// ═══════════════════════════════════════════
//  HEADER & PHASE
// ═══════════════════════════════════════════
const phaseNames = {
  idle: 'Initializing',
  discovery: 'Discovering files',
  classifying: 'Classifying languages',
  parsing: 'Parsing & building graph',
  struct_embedding: 'Structure embedding → searchable',
  full_embedding: 'Full-text embedding',
  rebuilding: 'Building search index',
  complete: 'Codebase ready',
};

function updateChrome(t) {
  document.getElementById('hdrTime').textContent = t.toFixed(1) + 's';
  document.getElementById('hdrTitle').textContent = `repoql · import github://owner/repo`;

  const dot = document.getElementById('hdrDot');
  if (pipeline.phase === 'complete') dot.className = 'hdr-dot done';
  else if (pipeline.phase !== 'idle') dot.className = 'hdr-dot active';

  document.getElementById('phaseVal').textContent = phaseNames[pipeline.phase] || pipeline.phase;

  document.getElementById('tsTotal').textContent = pipeline.discovered;
  document.getElementById('tsClassified').textContent = pipeline.classified;
  document.getElementById('tsParsed').textContent = pipeline.parsed;
  document.getElementById('tsSearchable').textContent = pipeline.structEmbedded;

  if (pipeline.phase === 'complete') {
    document.getElementById('doneWash').classList.add('show');
  }
}

// ═══════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════
let startTime = null;
let lastSpectrumUpdate = 0;

function loop(ts) {
  if (!startTime) startTime = ts;
  const t = (ts - startTime) / 1000;

  updatePipeline(t);
  updateTreemap();
  updateRings();
  updateSankey();
  updateStream(t);
  updateChrome(t);

  // Spectrum updates less frequently (expensive DOM churn)
  if (t - lastSpectrumUpdate > 0.5) {
    updateSpectrum();
    lastSpectrumUpdate = t;
  }

  if (pipeline.phase !== 'complete' || t < 40) {
    requestAnimationFrame(loop);
  }
}

setTimeout(() => requestAnimationFrame(loop), 300);
</script>
</body>
</html>
