<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#060d14"/>
  <!-- Simplified RQL at favicon scale — thicker proportional strokes, snapped to pixel grid -->
  <g fill="none" stroke="#d0ece4" stroke-linecap="round">
    <!-- R -->
    <path d="M 5 12 L 5 21" stroke-width="2"/>
    <path d="M 5 12 C 5 11, 7 10, 8 10 C 10 10, 11 11, 11 13 C 11 14.5, 10 15.5, 8 16 L 5 16" stroke-width="1.8"/>
    <path d="M 8 16 L 11 21" stroke-width="1.8"/>
    <!-- Q -->
    <circle cx="16.5" cy="16" r="5" stroke-width="2"/>
    <path d="M 20 19 L 23 22" stroke-width="1.8"/>
    <!-- L -->
    <path d="M 26 11 L 26 21" stroke-width="2"/>
    <path d="M 26 21 L 30 21" stroke-width="1.8"/>
  </g>
  <!-- Hub dot -->
  <circle cx="16.5" cy="16" r="1.2" fill="#2dd4bf"/>
  <!-- Minimal branches — just hints of the network -->
  <g fill="none" stroke="none" stroke-linecap="round" opacity="0.4">
    <path d="M 5 12 C 3 10, 2 8, 3 6" stroke-width="0.8"/>
    <path d="M 11 21 C 12 22, 13 22, 14 21" stroke-width="0.7"/>
    <path d="M 16.5 11 C 17 9, 18 7, 17 5" stroke-width="0.8"/>
    <path d="M 21 14 C 23 13, 25 13, 26 11" stroke-width="0.7"/>
    <path d="M 12 18 C 10 19, 8 19, 6 20" stroke-width="0.7"/>
    <path d="M 23 22 C 25 23, 27 23, 28 22" stroke-width="0.7"/>
    <path d="M 30 21 C 31 22, 31 24, 30 25" stroke-width="0.7"/>
    <path d="M 26 11 C 27 9, 29 8, 30 9" stroke-width="0.7"/>
  </g>
</svg>
