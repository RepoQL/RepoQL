syntax = "proto3";

package repoql.embedding.v1;

option csharp_namespace = "RepoQL.Embedding";

// Contextual embedding service for RepoQL.
// Proxies to Voyage AI voyage-context-3 — every call uses the contextual endpoint.
// Chunks grouped by document are embedded with mutual awareness.
service EmbeddingService {
  // Embed grouped chunks with document context.
  // Each group is chunks from one document, ordered by position.
  rpc EmbedChunks(EmbedChunksRequest) returns (EmbedChunksResponse);

  // Embed a single query string for search.
  // Uses the same model and vector space as EmbedChunks.
  rpc EmbedQuery(EmbedQueryRequest) returns (EmbedQueryResponse);

  // Returns model name and dimension for compatibility checking.
  // Host validates before embedding — mismatched models corrupt search.
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);

  // Rerank documents by relevance to a query.
  // Returns documents in descending relevance order with scores.
  rpc Rerank(RerankRequest) returns (RerankResponse);

  // Submit agent feedback about RepoQL experience.
  // Stored server-side for product improvement.
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
}

message EmbedChunksRequest {
  // Groups of chunks, each from one document.
  // Order within a group matters — chunks should be in document order.
  repeated ChunkGroup groups = 1;

  // Canonical repo origin for cache shard placement.
  // Normalized: "{host}/{path}" (e.g., "github.com/org/repo").
  // Empty = skip cloud cache (e.g., file:// with no git remote).
  string source = 2;

  // How these embeddings will be used. The server may choose different models
  // or routing based on the use case.
  EmbeddingUseCase use_case = 3;
}

// Describes the embedding use case so the server can optimize model selection.
enum EmbeddingUseCase {
  // Default: real-time embedding for search queries and incremental updates.
  EMBEDDING_USE_CASE_REALTIME = 0;
  // Batch/idle embedding for full-text content during background refresh.
  EMBEDDING_USE_CASE_BATCH = 1;
  // Structure embedding (headline + structure summaries).
  EMBEDDING_USE_CASE_STRUCTURE = 2;
}

message ChunkGroup {
  // Document URI (for logging/metering, not used by Voyage).
  string document_uri = 1;

  // Document-level context (x-ray headline, summary, structure).
  // Sent to Voyage as the first element in the group so all content chunks
  // benefit from document-level awareness. The service does NOT return a
  // vector for this element — only content chunks get vectors.
  string context = 2;

  // Ordered content chunks from this document.
  // These are the elements that receive embedding vectors.
  repeated string chunks = 3;
}

message EmbedChunksResponse {
  // One embedding per input chunk, in input order (groups flattened sequentially).
  repeated ChunkEmbedding embeddings = 1;
  // Total tokens consumed by Voyage for this request.
  int32 total_tokens = 2;
}

message ChunkEmbedding {
  // Index into the flattened chunk list (group 0 chunks, then group 1, etc.).
  int32 index = 1;
  // The embedding vector (1024 floats for voyage-context-3).
  repeated float vector = 2;
  // Non-empty if this chunk failed. Other chunks still succeed.
  string error = 3;
}

message EmbedQueryRequest {
  string text = 1;
}

message EmbedQueryResponse {
  repeated float vector = 1;
  int32 tokens = 2;
}

message GetModelInfoRequest {}

message GetModelInfoResponse {
  string model = 1;
  int32 dimension = 2;
}

// ----- Reranking -----

message RerankRequest {
  // The search query.
  string query = 1;
  // Documents to rerank. Index is preserved in the response.
  repeated RerankDocument documents = 2;
  // Optional instruction for instruction-following rerankers (rerank-2.5).
  // Empty = no instruction. Example: "rank by relevance to themes: auth middleware"
  string instruction = 3;
  // Model override. Empty = server default (rerank-2.5).
  string model = 4;
  // Return only top_k results. 0 = return all.
  int32 top_k = 5;
}

message RerankDocument {
  // Caller-assigned index (returned unchanged in response for stable mapping).
  int32 index = 1;
  // Document text to score against the query.
  string text = 2;
}

message RerankResponse {
  // Documents in descending relevance order.
  repeated RerankResult results = 1;
  // Total tokens consumed.
  int32 total_tokens = 2;
}

message RerankResult {
  // Original index from the request.
  int32 index = 1;
  // Relevance score (0.0-1.0).
  float relevance_score = 2;
}

// ----- Feedback -----

message SubmitFeedbackRequest {
  // Stable UUID for this MCP session.
  string session_id = 1;
  // Agent feedback text.
  string feedback = 2;
  // Output of ::diagnostics.fast at time of submission.
  string diagnostics = 3;
  // RepoQL version string.
  string version = 4;
  // OS/platform identifier.
  string platform = 5;
}

message SubmitFeedbackResponse {
  // True if feedback was persisted successfully.
  bool accepted = 1;
}
