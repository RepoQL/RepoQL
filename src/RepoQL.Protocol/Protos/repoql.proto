syntax = "proto3";

package repoql.v1;

option csharp_namespace = "RepoQL.Contracts";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Generic RepoQL API: execute raw SQL and fetch document summaries from annotations.
// - Not tied to file types: summaries are backed by generic annotation rows (kind, severity, message, data).
// - Batch-friendly: endpoints accept multiple URIs.
service RepoQL {
  // Execute an arbitrary SQL query against the RepoQL database.
  // Intended for trusted callers and diagnostics; callers should use parameters for values.
  rpc ExecuteRawQuery(RawQueryRequest) returns (RawQueryResponse);

  // Stream results for large queries. The first message may include column schema; all messages carry a single row.
  rpc ExecuteRawQueryStream(RawQueryRequest) returns (stream RawQueryRow);

  // Fetch document summaries for one or more repository URIs by reading precomputed annotations.
  // The server filters by annotation kinds (default: ["outline"]) and minimum severity.
  rpc GetDocumentSummaries(GetDocumentSummariesRequest) returns (GetDocumentSummariesResponse);

  // Maintain a lightweight client lease. The client opens a client-streaming RPC and
  // periodically sends beats while it is active. The server uses lease presence to
  // determine when an implicitly-started host can shut down after an idle grace period.
  rpc HoldClientLease(stream ClientLeaseBeat) returns (ClientLeaseSummary);

  // Trigger a full re-index of the repository. The server enumerates all files
  // and re-queues them for indexing. Progress is streamed as phases with counts.
  rpc ReindexAll(ReindexRequest) returns (stream ReindexProgress);

  // Wait for selected pipeline stages to become idle. Returns once the condition is met.
  rpc WaitForPipeline(WaitForPipelineRequest) returns (WaitForPipelineResponse);

  // Import an external repository (e.g., github://owner/repo). Returns after waiting for pipeline stages.
  rpc ImportRepository(ImportRequest) returns (ImportResponse);

  // Retrieve the current pipeline status without blocking.
  rpc GetPipelineStatus(GetPipelineStatusRequest) returns (GetPipelineStatusResponse);

  // Instruct the host process to shut down gracefully.
  rpc ShutdownHost(ShutdownHostRequest) returns (ShutdownHostResponse);

  // Run the hot-path pipeline for a single document without persisting results.
  rpc PreviewDocument(PreviewDocumentRequest) returns (PreviewDocumentResponse);

  // Execute an explore query returning both structured results and pre-rendered output.
  rpc Explore(ExploreRequest) returns (ExploreResponse);

  // Read repository content with token-budget-aware representation selection.
  rpc Read(ReadRequest) returns (ReadResponse);

  // Stream real-time status events. Replaces polling for live dashboard updates.
  rpc WatchStatus(WatchStatusRequest) returns (stream StatusEvent);
}

// ----- Raw query -----

message RawQueryRequest {
  // SQL text; may reference positional parameters using database conventions.
  string sql = 1;
  // Positional parameter values. The server binds in order.
  repeated google.protobuf.Value parameters = 2;
  // Optional row limit; 0 means no explicit limit.
  int32 limit = 3;
  // Token budget for response. If exceeded and SQL contains a comment, server may LLM-summarize.
  // Default 0 means unlimited.
  int32 token_budget = 4;
}

message ColumnSchema {
  // Column name as reported by the database.
  string name = 1;
  // Database-native type label (e.g., "VARCHAR", "INTEGER"). Best-effort.
  string db_type = 2;
}

message RowData {
  // Values in the same order as the "columns" array.
  repeated google.protobuf.Value values = 1;
}

message RawQueryResponse {
  // Column schema for the rows returned in this response.
  repeated ColumnSchema columns = 1;
  // Rows materialized into memory. For large results use ExecuteRawQueryStream.
  repeated RowData rows = 2;
  // Number of rows returned in this response.
  int64 row_count = 3;
  // True when the server applied a limit and results were truncated.
  bool truncated = 4;
  // Query execution time in milliseconds.
  int64 execution_time_ms = 5;
  // Number of files pending indexing (0 = ready).
  int32 index_pending = 6;
  // True if semantic embeddings are enabled.
  bool semantic_enabled = 7;
  // True if semantic index is ready (embeddings complete).
  bool semantic_ready = 8;
  // True if response was LLM-summarized due to exceeding token budget.
  bool summarized = 9;
  // Original row count before summarization (only set when summarized=true).
  int64 original_row_count = 10;
}

message RawQueryRow {
  // On the first message, columns may be populated; subsequent messages may omit.
  repeated ColumnSchema columns = 1;
  RowData row = 2;
}

// ----- Document summaries via annotations -----

message GetDocumentSummariesRequest {
  // Absolute repository URIs (container URIs) of documents to summarize.
  repeated string uris = 1;

  // Annotation kinds to include (case-insensitive). Defaults to ["outline"].
  repeated string kinds = 2;

  // Minimum severity to include ("hint"|"info"|"warning"|"error"). Default: "hint".
  string min_severity = 3;

  // Whether to include annotation.data (structured payload).
  bool include_data = 4;

  // Whether to include annotation.message (human-readable text summary).
  bool include_message = 5;

  // Whether to include a resolved target URI (when available via views).
  bool include_resolved_target_uri = 6;
}

message GetDocumentSummariesResponse {
  repeated DocumentSummaryResult results = 1;
}

message DocumentSummaryResult {
  // The input URI this result corresponds to.
  string uri = 1;
  // Lookup status for this URI.
  SummaryStatus status = 2;
  // Error message when status == ERROR; otherwise empty.
  string error = 3;
  // Annotations that constitute the document summary.
  repeated SummaryAnnotation annotations = 4;
}

enum SummaryStatus {
  SUMMARY_STATUS_UNSPECIFIED = 0;
  OK = 1;
  NOT_FOUND = 2;
  ERROR = 3;
}

message SummaryAnnotation {
  // Annotation id (UUID string).
  string id = 1;
  // Optional business key for idempotent upserts.
  string semantic_key = 2;
  // Annotation kind (e.g., "outline", "xray", "metric", "lint").
  string kind = 3;
  // Free text severity (e.g., hint|info|warning|error).
  string severity = 4;
  // Producer name (e.g., "markdown-parser").
  string source = 5;
  // Producer rule id (optional).
  string rule_id = 6;

  // Human-readable message; may contain multi-line summaries (e.g., outlines).
  string message = 7;

  // Structured payload; schema depends on kind. Included only when requested.
  google.protobuf.Struct data = 8;

  // Resolved target URI if available; typically computed via a view.
  string resolved_target_uri = 9;

  // Optional low-level targets (ids may be UUID strings); present for advanced clients.
  string target_node_id = 10;
  string target_edge_id = 11;
  string target_span_id = 12;

  // Timestamps in UTC.
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp expires_at = 14;
}

// ----- Client lease for idle shutdown control -----

message ClientLeaseBeat {
  // Stable id for this client session (UUID string).
  string client_id = 1;
  // Optional: process id of the client.
  int32 pid = 2;
  // Tool name (e.g., "repoql", "repoql-mcp").
  string tool = 3;
  // Tool version string.
  string version = 4;
  // Repository path this client is operating in (normalized absolute path).
  string repo_path = 5;
  // First beat time in RFC3339 format.
  string started_at = 6;
  // Last beat time in RFC3339 format.
  string beat_at = 7;
}

message ClientLeaseSummary {
  // Host start time in RFC3339 format.
  string server_started_at = 1;
  // True if this host was started implicitly by a client.
  bool implicit_start = 2;
  // Number of currently active client leases at time of response.
  int32 active_clients = 3;
  // Idle shutdown grace period in seconds (if implicit).
  int32 shutdown_after_idle_seconds = 4;
}


// ----- Maintenance: full re-index -----

message ReindexRequest {
  // When true, the server MAY attempt to clear existing graph rows prior to re-indexing.
  // Implementations are allowed to ignore this flag and rely on upsert semantics.
  bool clear = 1;
}

message ReindexProgress {
  ReindexPhase phase = 1;
  // Number of items discovered (for phases that track it).
  uint64 total_items = 2;
  // Number of items processed in this phase (queued, indexed, analyzed, etc).
  uint64 processed_items = 3;
  // Milliseconds elapsed within the current phase.
  uint64 phase_elapsed_ms = 4;
}

enum ReindexPhase {
  REINDEX_PHASE_UNSPECIFIED = 0;
  REINDEX_PHASE_PREPARING = 1;
  REINDEX_PHASE_ENUMERATING = 2;
  REINDEX_PHASE_QUEUEING = 3;
  REINDEX_PHASE_HOT_PATH = 4;
  REINDEX_PHASE_PRUNING = 5;
  REINDEX_PHASE_VECTOR_REFRESH = 6;
  REINDEX_PHASE_MULTIFILE_ANALYSIS = 7;
  REINDEX_PHASE_INDEX_REBUILD = 8;
  REINDEX_PHASE_COMPLETED = 9;
}

enum PipelineStage {
  PIPELINE_STAGE_UNSPECIFIED = 0;
  // Legacy stages (for backward compatibility with WaitForPipeline/Import)
  PIPELINE_STAGE_DISCOVERY = 1;
  PIPELINE_STAGE_INDEXING = 2;
  PIPELINE_STAGE_SEMANTIC_INDEXING = 3;
  PIPELINE_STAGE_ANALYSIS = 4;
  // Granular hot path stages
  PIPELINE_STAGE_DISCOVER = 10;
  PIPELINE_STAGE_FILTER = 11;
  PIPELINE_STAGE_CLASSIFY = 12;
  PIPELINE_STAGE_PARSE = 13;
  PIPELINE_STAGE_EXPLORE = 14;
  PIPELINE_STAGE_COMMIT = 15;
  // Granular idle processing stages
  PIPELINE_STAGE_PRUNE = 20;
  PIPELINE_STAGE_STRUCT_EMBED = 21;
  PIPELINE_STAGE_VECTOR_REFRESH = 22;
  PIPELINE_STAGE_MULTI_FILE_ANALYSIS = 23;
}

message WaitForPipelineRequest {
  // Stages to wait on. When empty, defaults to discovery+indexing+analysis.
  repeated PipelineStage stages = 1;
  // When true, wait for all selected stages to become idle. When false, waits for any.
  bool wait_all = 2;
}

message WaitForPipelineResponse {
  PipelineStatus status = 1;
}

message ImportRequest {
  // Repository URI to import (e.g., github://owner/repo@ref).
  string uri = 1;
  // Stage to wait for after enqueueing imported artifacts. When omitted the server waits for
  // SEMANTIC_INDEXING to ensure embeddings are ready for search. Pass INDEXING for hot-path only,
  // or UNSPECIFIED to return immediately without waiting.
  optional PipelineStage wait_stage = 2;
}

message ImportResponse {
  PipelineStatus status = 1;
}

message GetPipelineStatusRequest {}

message GetPipelineStatusResponse {
  PipelineStatus status = 1;
}

message PipelineStatus {
  google.protobuf.Timestamp captured_at = 1;
  repeated StageStatus stages = 2;
  bool reindexing = 3;
  bool writer_pending = 4;
}

message StageStatus {
  PipelineStage stage = 1;
  bool busy = 2;
  uint32 queued = 3;
  uint32 in_progress = 4;

  // Timing metrics
  double avg_duration_ms = 5;        // EMA of item latency
  double peak_duration_ms = 6;       // Max in current/last run
  int64 processed_total = 7;         // Cumulative processed
  double throughput_per_sec = 8;     // Items/sec (rolling)

  // Sparkline data (last 20 samples)
  repeated double latency_samples = 9;   // For latency sparkline
  repeated uint32 queue_samples = 10;    // For burndown sparkline

  // Phase tracking (for idle stats)
  google.protobuf.Timestamp last_active = 11;   // When phase ended
  double last_run_duration_sec = 12;            // How long the run took
  int64 last_run_items = 13;                    // Items in last run
}

message ShutdownHostRequest {
  // Reserved for future force flags.
}

message ShutdownHostResponse {
  // Process id of the host that initiated shutdown.
  int32 process_id = 1;
}

// ----- Format preview -----

message PreviewDocumentRequest {
  // Repository URI of the document to preview (e.g., file:///docs/readme.md).
  string uri = 1;
  // Optional file name override when uploading content.
  string file_name = 2;
  // Optional semantic media type hint (e.g., markdown.doc).
  string media_type_hint = 3;
  // Optional content to preview instead of reading from the repository.
  bytes content = 4;
}

message PreviewStageTiming {
  string stage = 1;
  int64 duration_ms = 2;
  string status = 3;
  string error = 4;
}

message PreviewArtifact {
  string id = 1;
  string digest = 2;
  int64 size_bytes = 3;
  string media_type = 4;
  string headline = 5;
  string summary = 6;
  string structure = 7;
  string store_uri = 8;
}

message PreviewNode {
  string id = 1;
  string kind = 2;
  string uri = 3;
  string artifact_id = 4;
  string span_id = 5;
  string headline = 6;
  string structure = 7;
  string props_json = 8;
}

message PreviewSpan {
  string id = 1;
  string document_id = 2;
  int64 start_byte = 3;
  int64 end_byte = 4;
  int32 start_line = 5;
  int32 end_line = 6;
  int32 start_column = 7;
  int32 end_column = 8;
}

message PreviewEdge {
  string id = 1;
  string type = 2;
  bool is_composition = 3;
  int32 ordinal = 4;
  string scope_document_id = 5;
  string edge_key = 6;
  string src_id = 7;
  string dst_id = 8;
  string src_span_id = 9;
  string dst_span_id = 10;
  string props_json = 11;
}

message PreviewAnnotation {
  string kind = 1;
  string severity = 2;
  string source = 3;
  string rule_id = 4;
  string message = 5;
}

message PreviewRecords {
  repeated PreviewArtifact artifacts = 1;
  repeated PreviewNode nodes = 2;
  repeated PreviewSpan spans = 3;
  repeated PreviewEdge edges = 4;
  repeated PreviewAnnotation annotations = 5;
}

message PreviewDocumentResponse {
  bool success = 1;
  string error = 2;
  string media_type = 3;
  string digest_hex = 4;
  PreviewRecords records = 5;
  repeated PreviewStageTiming stages = 6;
}

// ----- Explore: semantic search with structured + rendered output -----

message ExploreRequest {
  // Maximum tokens to invest in the response.
  int32 token_budget = 1;
  // Search intent (zoom level).
  ExploreIntent intent = 2;
  // Scope filter (glob pattern or URI).
  string scope = 3;
  // Search keywords for semantic search.
  string keywords = 4;
  // Comma-separated regex patterns to boost matches.
  string boost = 5;
  // Comma-separated regex patterns to de-rank matches.
  string penalize = 6;
  // Max results to show (0 = auto-calculate).
  int32 limit = 7;
}

enum ExploreIntent {
  EXPLORE_INTENT_UNSPECIFIED = 0;
  EXPLORE_INTENT_INVENTORY = 1;
  EXPLORE_INTENT_LOCATE = 2;
  EXPLORE_INTENT_INSPECT = 3;
  EXPLORE_INTENT_EXPLAIN = 4;
}

message ExploreResponse {
  // True if the query executed successfully.
  bool success = 1;
  // Error message if success is false.
  string error = 2;
  // Pre-rendered markdown output for display/MCP.
  string rendered_output = 3;
  // Structured results for programmatic use.
  repeated ExploreResultItem results = 4;
  // True if results were truncated due to token budget.
  bool truncated = 5;
  // Current indexer status with readiness info.
  ExploreIndexerStatus status = 6;
}

message ExploreResultItem {
  // File or symbol URI.
  string uri = 1;
  // Confidence score 1-100.
  int32 confidence = 2;
  // Kind (e.g., "class", "method") - only for symbols.
  string kind = 3;
  // One-line summary.
  string headline = 4;
  // Outline/hierarchy.
  string structure = 5;
  // Code excerpt.
  string snippet = 6;
  // Language hint for code fence.
  string lang = 7;
  // Semantic type for grouping.
  string semantic_type = 8;
  // Nested child objects.
  repeated ExploreResultItem children = 9;
}

message ExploreIndexerStatus {
  // Number of items pending indexing (>0 means incomplete).
  int32 index_pending = 1;
  // True if semantic search (embeddings) is ready.
  bool semantic_ready = 2;
  // Convenience: true when index_pending==0 && (no keywords || semantic_ready).
  bool ready = 3;
  // Query elapsed time in milliseconds.
  int64 elapsed_ms = 4;
}

// ----- Read: token-budget-aware content retrieval -----

message ReadRequest {
  // URI or glob pattern (e.g., file:///path, help:///file.md, file:///**/*.cs).
  // Append ' // <question>' for LLM synthesis via xray Understand.
  string uri = 1;
  // Token budget - determines representation depth (full/structure/headline).
  int32 token_budget = 2;
}

message ReadResponse {
  // True if the read executed successfully.
  bool success = 1;
  // Error message if success is false.
  string error = 2;
  // Pre-rendered output for display/MCP.
  string rendered_output = 3;
  // Representation level used (full/structure/headline/glob/question).
  string representation = 4;
  // Number of files read (for glob patterns).
  int32 files_read = 5;
  // Number of files omitted due to budget constraints.
  int32 files_omitted = 6;
  // Current indexer status with readiness info.
  ExploreIndexerStatus status = 7;
}

// ----- WatchStatus: real-time status streaming -----

message WatchStatusRequest {
  // Reserved for future filters (e.g., event types to subscribe to).
}

message StatusEvent {
  // Event timestamp.
  google.protobuf.Timestamp timestamp = 1;
  // Event payload - one of the following.
  oneof event {
    PipelineStatusEvent pipeline = 2;
    IndexingActivityEvent activity = 3;
    HealthEvent health = 4;
    StatsSnapshotEvent stats = 5;
  }
}

message PipelineStatusEvent {
  // Per-stage status (legacy, for backward compatibility).
  repeated StageStatus stages = 1;
  // True if a reindex operation is in progress.
  bool reindexing = 2;
  // True if writer has pending work.
  bool writer_pending = 3;
  // Convenience: true when all stages idle and no pending work.
  bool ready = 4;

  // Granular hot path status (new).
  HotPathStatus hot_path = 10;
  // Granular idle processing status (new).
  IdleProcessingStatus idle_processing = 11;
}

// Hot path: Discover -> Filter -> Classify -> Parse -> XRay -> Commit
message HotPathStatus {
  // True if any hot path work is in progress.
  bool active = 1;
  // Total items queued across hot path.
  int32 queued = 2;
  // Total items currently being processed.
  int32 in_progress = 3;
  // Current throughput (files/sec).
  double throughput_per_sec = 4;
  // Per-stage metrics.
  repeated StageStatus stages = 10;
}

// Idle processing: Prune -> Struct Embed -> Vector Refresh -> Analysis
message IdleProcessingStatus {
  // True if idle processing is in progress.
  bool active = 1;
  // Current phase being processed.
  string current_phase = 2;
  // Items processed in current phase.
  int32 progress = 3;
  // Total items to process in current phase.
  int32 total = 4;
  // Average duration per item in current phase.
  double avg_duration_ms = 5;
  // When idle processing last completed.
  google.protobuf.Timestamp last_run = 10;
  // Duration of last complete run.
  double last_run_duration_sec = 11;
  // Items processed in last run.
  int64 last_run_items = 12;
  // Per-stage metrics.
  repeated StageStatus stages = 20;
}

message IndexingActivityEvent {
  // Type of activity.
  IndexingActivityType type = 1;
  // File URI being processed (if applicable).
  string uri = 2;
  // Human-readable description.
  string message = 3;
  // Items remaining in queue for this stage.
  int32 queued_count = 4;
  // Items processed in this batch.
  int32 processed_count = 5;
}

enum IndexingActivityType {
  INDEXING_ACTIVITY_UNSPECIFIED = 0;
  INDEXING_ACTIVITY_FILE_CHANGED = 1;
  INDEXING_ACTIVITY_FILE_DISCOVERED = 2;
  INDEXING_ACTIVITY_FILE_PARSED = 3;
  INDEXING_ACTIVITY_FILE_ANALYZED = 4;
  INDEXING_ACTIVITY_EMBEDDINGS_GENERATED = 5;
  INDEXING_ACTIVITY_BATCH_COMPLETE = 6;
  INDEXING_ACTIVITY_IDLE = 7;
}

message HealthEvent {
  // Type of health event.
  HealthEventType type = 1;
  // Human-readable message.
  string message = 2;
  // Severity level.
  HealthSeverity severity = 3;
}

enum HealthEventType {
  HEALTH_EVENT_UNSPECIFIED = 0;
  HEALTH_EVENT_CONNECTED = 1;
  HEALTH_EVENT_DISCONNECTED = 2;
  HEALTH_EVENT_WARNING = 3;
  HEALTH_EVENT_ERROR = 4;
}

enum HealthSeverity {
  HEALTH_SEVERITY_UNSPECIFIED = 0;
  HEALTH_SEVERITY_INFO = 1;
  HEALTH_SEVERITY_WARNING = 2;
  HEALTH_SEVERITY_ERROR = 3;
}

message StatsSnapshotEvent {
  // Total files indexed.
  int64 total_files = 1;
  // Total nodes in the graph.
  int64 total_nodes = 2;
  // Percentage of files with explore coverage (headline/summary).
  int32 explore_coverage_percent = 3;
  // True if embeddings are ready for semantic search.
  bool embeddings_ready = 4;
}
